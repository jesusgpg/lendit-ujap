  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--soft);font:16px/1.5 var(--sans)}button{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{min-height:100vh;background:radial-gradient(circle at 88% 5%,rgba(201,151,31,.13),transparent 25%),linear-gradient(130deg,rgba(26,43,107,.06),transparent 52%),var(--paper)}
    .topbar{height:76px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(239,230,208,.86)}.brand{display:flex;align-items:center;gap:12px;color:var(--ink);font:600 20px var(--display)}.crest{width:42px;height:42px;object-fit:contain}.top-meta{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--faint);font:12px var(--mono);letter-spacing:.04em;text-transform:uppercase}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;color:var(--navy);background:#d9dff3;font-weight:700;font-family:var(--sans)}

    .layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:26px;align-items:start}.main-card,.summary-card{border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 16px 38px -30px rgba(22,15,5,.38)}.main-card{padding:28px}.summary-card{overflow:hidden;position:sticky;top:20px}.section-kicker{margin:0 0 18px;color:var(--faint);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.date-box{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fffefa}.date-box span{display:block;color:var(--faint);font-size:12px}.date-box strong{display:block;margin-top:3px;color:var(--ink);font:600 17px var(--display)}.edit{display:inline-block;margin-top:13px;color:var(--red-dark);font-size:13px;font-weight:600;text-decoration:none}.edit:hover{text-decoration:underline}.separator{height:1px;background:var(--line);margin:24px 0}.message-row{display:flex;gap:12px;align-items:center;color:var(--soft);font-size:13px}.message-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(26,43,107,.08);color:var(--navy);font-size:17px}.price-row{display:flex;justify-content:space-between;gap:12px;color:var(--soft);font-size:14px}.price-row.total{align-items:baseline;margin-top:14px;color:var(--ink);font-weight:700}.price-row.total strong{font:600 32px var(--display)}.price-caption{margin:6px 0 0;color:var(--faint);font-size:12px}.action{width:100%;min-height:52px;margin-top:24px;border:0;border-radius:999px;background:var(--red);color:#fff8ee;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -11px rgba(150,9,31,.85);transition:transform .18s ease-out,background .18s ease-out}.action:hover{transform:translateY(-2px);background:var(--red-dark)}.text-button{display:block;margin:12px auto 0;border:0;background:none;color:var(--soft);font-size:13px;cursor:pointer}.text-button:hover{color:var(--red-dark)}     .editorial{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:560px;overflow:hidden;border-radius:20px;background:var(--navy);color:#f7f1e2;box-shadow:0 24px 48px -20px rgba(22,15,5,.35)}.editorial-main{padding:clamp(28px,5vw,54px)}.editorial .eyebrow{margin:0 0 16px;color:#e8b94f}.editorial h2{max-width:10ch;margin:0;color:#f7f1e2;font:500 clamp(40px,5.8vw,68px)/.98 var(--display);letter-spacing:-1.6px}.editorial-copy{margin-top:20px;color:rgba(247,241,226,.72);font-size:14px;max-width:42ch}.editorial .date-grid{margin-top:32px}.editorial .date-box{border-color:rgba(247,241,226,.2);background:rgba(255,255,255,.07);color:#f7f1e2}.editorial .date-box span{color:rgba(247,241,226,.58)}.editorial .date-box strong{color:#f7f1e2}.editorial .edit{color:#f3cd74}.editorial-side{padding:24px;background:#f8f4e8;color:var(--soft);display:flex;flex-direction:column}.editorial-side .item-photo{height:145px;border-radius:13px}.editorial-side .item-name{font-size:21px}.editorial-side .price-row.total strong{font-size:30px}.editorial-side .action{margin-top:auto}.editorial-side .fineprint{color:var(--faint)}
    .result{display:none;margin-top:16px;padding:13px 15px;border-radius:11px;font-size:13px}.result.show{display:block;animation:rise .22s ease-out both}.result.ok{background:#e8f3eb;color:#205a37;border:1px solid #bad9c4}.result.fail{background:#fbeaec;color:#8a2332;border:1px solid #edbdc3}.result.cancel{background:#f4f0e5;color:#685b38;border:1px solid #e2d5b3}.result strong{display:block;margin-bottom:2px}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .demo-tools{margin-top:14px;padding:14px;border:1px dashed rgba(22,29,51,.22);border-radius:12px;background:rgba(255,255,255,.72)}.demo-tools p{margin:0 0 10px;color:var(--faint);font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}.demo-actions{display:flex;flex-wrap:wrap;gap:7px}.demo-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:white;color:var(--soft);font-size:11px;cursor:pointer}.demo-actions button:hover{border-color:var(--navy);color:var(--navy)}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font:13px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.result.show{animation:none}}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}.proto-picker[data-position=top]{bottom:auto;top:24px}
    @media(max-width:760px){.page{padding:28px 18px 100px}.topbar{height:64px}.top-meta{font-size:10px}.layout{grid-template-columns:1fr}.summary-card{position:static;grid-row:1}.editorial{grid-template-columns:1fr}.editorial-side{min-height:440px}.editorial-side .action{margin-top:25px}.editorial h2{max-width:12ch}.summary-card .item-photo{height:135px}.summary-card{display:grid;grid-template-columns:140px 1fr}.summary-card .item-photo{height:100%;min-height:170px}.summary-card .summary-content{padding:16px}.summary-card .trust{grid-column:1/-1}.stepper{font-size:9px;gap:6px}.step-line{width:18px}}
    @media(max-width:430px){.brand{font-size:17px}.crest{width:35px;height:35px}.top-meta span:first-child{display:none}.date-grid{grid-template-columns:1fr}.main-card{padding:20px}.summary-card{grid-template-columns:1fr}.summary-card .item-photo{height:130px;min-height:0}.page-title{font-size:39px}.stepper{justify-content:space-between}.step span{display:none}.step-line{flex:1}.proto-picker{bottom:16px}.proto-picker-item{padding:0 9px;font-size:12px}}

<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><img class="crest" src="/images/Logo-UJAP1.png" alt="" onerror="this.style.display='none'"><span>LendIt UJAP</span></div><div class="top-meta"><span>Solicitud de alquiler</span><span class="avatar">JR</span></div></header>
    <main class="page" id="stage" aria-live="polite"></main>
  </div>
  <nav class="proto-picker" aria-label="Variantes del prototipo">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Resumen</button>
    <button class="proto-picker-item">Paso a paso</button>
    <button class="proto-picker-item">Editorial</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Reiniciar estado (R)">↻</button>
  </nav>
  <script>
    const item = `<div class="item-photo" aria-hidden="true">🧮</div><div class="summary-content"><span class="item-tag">Herramientas · Alquiler</span><h3 class="item-name">Calculadora científica</h3><div class="owner"><span class="avatar">MR</span><span>Publicada por Mariana Rojas</span></div><div class="sum-total"><span>Total de ejemplo</span><strong>$ 3,00</strong></div></div><div class="trust"><span class="check">✓</span> Miembro de la comunidad UJAP</div>`;
    const notice = `<div class="notice"><span class="notice-icon" aria-hidden="true">i</span><div><strong>Estás en una simulación</strong><p>No se realizará ningún cobro ni necesitas ingresar datos de tarjeta. El resultado es solo para probar el flujo.</p></div></div>`;
    const dates = `<div class="date-grid"><div class="date-box"><span>Retiro</span><strong>Mar, 27 oct · 10:00</strong></div><div class="date-box"><span>Devolución</span><strong>Mar, 27 oct · 16:00</strong></div></div><a class="edit" href="#" onclick="event.preventDefault();showResult('cancel')">Editar fechas ↗</a>`;
    function tools(){return `<div class="demo-tools"><p>Controles de demostración · no procesan pagos</p><div class="demo-actions"><button onclick="showResult('ok')">Simular éxito</button><button onclick="showResult('fail')">Simular rechazo</button><button onclick="showResult('cancel')">Cancelar</button></div></div><div id="result" class="result" role="status" aria-live="polite"></div>`}
    function heading(){return `<button class="back" onclick="showResult('cancel')">← VOLVER A LA SOLICITUD</button><p class="eyebrow">Confirmación · paso final</p><h1 class="page-title">Una última revisión antes de solicitar.</h1><p class="lead">Confirma las fechas y revisa el monto de ejemplo. Después podrás enviar la solicitud a quien publicó el objeto.</p>${notice}`}
    const variants=[
      ()=>`${heading()}<div class="layout"><section class="main-card"><p class="section-kicker">Tu solicitud</p>${dates}<div class="separator"></div><div class="message-row"><span class="message-icon" aria-hidden="true">✉</span><span>La persona propietaria deberá aprobar tu solicitud.</span></div><div class="separator"></div><div class="price-row"><span>Precio de ejemplo</span><strong>$ 3,00</strong></div><div class="price-row total"><span>Total estimado</span><strong>$ 3,00</strong></div><p class="price-caption">Importe ilustrativo para el prototipo; falta definir la regla de precio.</p><button class="action" onclick="showResult('ok')">Continuar con simulación</button><button class="text-button" onclick="showResult('cancel')">Cancelar y volver</button>${tools()}</section><aside class="summary-card">${item}</aside></div>`,
      ()=>`${heading()}<div class="layout"><section class="main-card"><div class="stepper"><div class="step"><b>✓</b><span>Fechas</span></div><i class="step-line"></i><div class="step"><b>2</b><span>Revisión</span></div><i class="step-line"></i><div class="step active"><b>3</b><span>Confirmar</span></div></div><h2 style="font:600 27px var(--display);color:var(--ink);margin:0 0 18px">Resumen de tu solicitud</h2>${dates}<div class="detail-list" style="margin-top:18px"><div class="detail"><span>Artículo</span><strong>Calculadora científica</strong></div><div class="detail"><span>Modalidad</span><strong>Alquiler simulado</strong></div><div class="detail"><span>Duración</span><strong>6 horas</strong></div><div class="detail"><span>Propietaria</span><strong>Mariana Rojas</strong></div></div><div class="method-card"><span class="method-mark" aria-hidden="true">◎</span><div><strong>Pago de demostración</strong><small>Sin tarjeta · Sin cargo real</small></div><span class="sim-tag">Prueba</span></div><div class="price-row total" style="margin-top:21px"><span>Total ilustrativo</span><strong>$ 3,00</strong></div><button class="action" onclick="showResult('ok')">Simular resultado</button><button class="text-button" onclick="showResult('cancel')">Cancelar solicitud</button>${tools()}</section><aside class="summary-card">${item}</aside></div>`,
      ()=>`${heading()}<div class="editorial"><section class="editorial-main"><p class="eyebrow">Tu próximo préstamo</p><h2>Que siga circulando.</h2><p class="editorial-copy">Revisa los detalles de esta solicitud a Mariana. El pago que ves es ficticio: este prototipo no conecta con ningún procesador.</p><p class="section-kicker" style="margin-top:32px;color:rgba(247,241,226,.55)">Fechas elegidas</p>${dates}<div class="message-row" style="margin-top:26px;color:rgba(247,241,226,.76)"><span class="message-icon" aria-hidden="true">✉</span><span>La solicitud queda pendiente de aprobación de la propietaria.</span></div></section><aside class="editorial-side"><div class="item-photo" aria-hidden="true">🧮</div><span class="item-tag" style="margin-top:18px">Herramientas · Alquiler</span><h3 class="item-name">Calculadora científica</h3><div class="owner"><span class="avatar">MR</span><span>Mariana Rojas</span></div><div class="price-row total"><span>Total de ejemplo</span><strong>$ 3,00</strong></div><p class="price-caption">Monto ilustrativo · regla por definir</p><button class="action" onclick="showResult('ok')">Probar el flujo</button><button class="text-button" onclick="showResult('cancel')">Volver a editar</button>${tools()}<p class="fineprint">Simulación · no hay cobro real</p></aside></div>`
    ];
    const messages={ok:['Éxito simulado','La prueba terminó correctamente. En el producto, la solicitud seguiría al paso de aprobación de Mariana.','ok'],fail:['Resultado simulado: rechazado','No se registró ningún cargo. Podrías revisar los datos y volver a intentarlo.','fail'],cancel:['Simulación cancelada','No se registró ningún pago. Puedes revisar las fechas o volver a la solicitud.','cancel']};
    function showResult(kind){const box=document.getElementById('result');if(!box)return;const m=messages[kind];box.className='result show '+m[2];box.innerHTML='<strong>'+m[0]+'</strong>'+m[1];box.scrollIntoView({block:'nearest',behavior:'smooth'})}
    const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;
    function move(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]()})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});move();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay.addEventListener('click',()=>mount(current));window.addEventListener('resize',move);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
